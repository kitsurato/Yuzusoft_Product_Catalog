<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yuzusoft Product Catalog</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="kicker">Yuzusoft Product Catalog</p>
      <h1>柚子社商品目录</h1>
    </div>
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="搜索作品、商品或文件名" autocomplete="off">
    </div>
  </header>

  <main class="layout">
    <aside class="index-panel">
      <div class="panel-head">
        <span id="workCount">0 works</span>
        <span id="imageCount">0 images</span>
      </div>
      <nav id="workIndex" class="work-index"></nav>
    </aside>

    <section class="content">
      <div id="activeWork" class="active-work"></div>
      <div id="productTabs" class="product-tabs"></div>
      <div id="gallery" class="gallery"></div>
    </section>
  </main>

  <dialog id="viewer" class="viewer">
    <button id="closeViewer" class="icon-button" aria-label="Close">×</button>
    <img id="viewerImage" alt="">
    <p id="viewerCaption"></p>
  </dialog>

  <script src="manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yuzusoft Product Catalog</title>
  <style>
:root {
  color-scheme: light;
  --ink: #202124;
  --muted: #6a6f77;
  --line: #dfe3e8;
  --paper: #fafafa;
  --panel: #ffffff;
  --accent: #d9455f;
  --accent-soft: #ffe8ed;
  --mint: #e8f6f1;
  --gold: #f6eedb;
  --shadow: 0 12px 30px rgba(24, 31, 42, 0.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: minmax(260px, 1fr) minmax(260px, 420px);
  gap: 24px;
  align-items: center;
  padding: 18px 28px;
  background: rgba(250, 250, 250, 0.92);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
}

.kicker {
  margin: 0 0 4px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 800;
}

.search-wrap input {
  width: 100%;
  height: 42px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink);
  font-size: 15px;
}

.layout {
  display: grid;
  grid-template-columns: 320px 1fr;
  min-height: calc(100vh - 79px);
}

.index-panel {
  position: sticky;
  top: 79px;
  height: calc(100vh - 79px);
  overflow: auto;
  padding: 18px;
  border-right: 1px solid var(--line);
  background: var(--panel);
}

.panel-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 14px;
  color: var(--muted);
  font-size: 13px;
}

.work-index {
  display: grid;
  gap: 10px;
}

.work-card {
  display: grid;
  grid-template-columns: 118px 1fr;
  gap: 12px;
  align-items: center;
  width: 100%;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.work-card:hover,
.work-card.active {
  border-color: var(--accent);
  box-shadow: var(--shadow);
}

.logo-frame {
  display: grid;
  place-items: center;
  width: 118px;
  height: 74px;
  border-radius: 6px;
  background: #fff;
  overflow: hidden;
}

.logo-frame img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.logo-fallback {
  font-weight: 800;
  color: var(--accent);
}

.work-name {
  display: block;
  font-size: 14px;
  font-weight: 750;
  overflow-wrap: anywhere;
}

.work-meta {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}

.content {
  min-width: 0;
  padding: 26px 28px 44px;
}

.active-work {
  display: grid;
  grid-template-columns: 180px minmax(0, 1fr);
  gap: 20px;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}

.active-logo {
  display: grid;
  place-items: center;
  height: 112px;
  border-radius: 8px;
  background: #fff;
  border: 1px solid var(--line);
}

.active-logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.active-title h2 {
  margin: 0 0 8px;
  font-size: 30px;
}

.active-title p {
  margin: 0;
  color: var(--muted);
}

.product-tabs {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  gap: 8px;
  padding: 0 0 18px;
}

.tab {
  min-height: 36px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  text-align: center;
  overflow-wrap: anywhere;
}

.tab.active {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: #8e2034;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 16px;
}

.product-section {
  display: contents;
}

.section-title {
  grid-column: 1 / -1;
  margin: 18px 0 0;
  color: var(--ink);
  font-size: 20px;
}

.image-card {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  overflow: hidden;
  cursor: zoom-in;
}

.image-card img {
  display: block;
  width: 100%;
  height: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  background: #fff;
}

.caption {
  min-height: 44px;
  padding: 10px;
  color: var(--muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}

.empty {
  padding: 40px;
  border: 1px dashed var(--line);
  border-radius: 8px;
  color: var(--muted);
  background: #fff;
}

.viewer {
  width: min(1100px, 94vw);
  max-height: 94vh;
  border: 0;
  border-radius: 8px;
  padding: 18px;
  background: #fff;
}

.viewer::backdrop {
  background: rgba(0, 0, 0, 0.68);
}

.viewer img {
  display: block;
  max-width: 100%;
  max-height: 78vh;
  margin: 0 auto;
  object-fit: contain;
}

.viewer p {
  margin: 12px 42px 0 0;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.icon-button {
  position: absolute;
  right: 12px;
  top: 10px;
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  font-size: 22px;
  cursor: pointer;
}

@media (max-width: 900px) {
  .topbar,
  .layout,
  .active-work {
    grid-template-columns: 1fr;
  }

  .index-panel {
    position: static;
    height: auto;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .work-index {
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }

  .content {
    padding: 20px 16px 36px;
  }
}

</style>
</head>

    <button id="closeViewer" class="icon-button" aria-label="Close">×</button>
    <img id="viewerImage" alt="">

  <script>
const data = window.CATALOG_DATA;

const state = {
  activeWork: data.works[0],
  activeProduct: "all",
  query: "",
};

const els = {
  workCount: document.querySelector("#workCount"),
  imageCount: document.querySelector("#imageCount"),
  workIndex: document.querySelector("#workIndex"),
  activeWork: document.querySelector("#activeWork"),
  productTabs: document.querySelector("#productTabs"),
  gallery: document.querySelector("#gallery"),
  search: document.querySelector("#searchInput"),
  viewer: document.querySelector("#viewer"),
  viewerImage: document.querySelector("#viewerImage"),
  viewerCaption: document.querySelector("#viewerCaption"),
  closeViewer: document.querySelector("#closeViewer"),
};

function imageMatches(image, product, work) {
  const q = state.query.trim().toLowerCase();
  if (!q) return true;
  return [image.name, image.work || "", product.code, product.title, work.code, work.title]
    .join(" ")
    .toLowerCase()
    .includes(q);
}

function filteredImagesFor(work, product) {
  return product.images.filter((image) => imageMatches(image, product, work));
}

function countVisibleImages(work) {
  return work.products.reduce((sum, product) => sum + filteredImagesFor(work, product).length, 0);
}

function logoMarkup(work, large = false) {
  const src = work.logo || work.fallbackImage;
  const className = large ? "active-logo" : "logo-frame";
  if (!src) return `<span class="${className}"><span class="logo-fallback">${work.code}</span></span>`;
  return `<span class="${className}"><img src="${src}" alt="${work.title}"></span>`;
}

function renderIndex() {
  els.workCount.textContent = `${Math.max(data.works.length - 1, 0)} works`;
  els.imageCount.textContent = `${data.totalImages} images`;
  els.workIndex.innerHTML = "";

  for (const work of data.works) {
    const visibleCount = countVisibleImages(work);
    if (state.query && visibleCount === 0) continue;

    const button = document.createElement("button");
    button.className = `work-card${work === state.activeWork ? " active" : ""}`;
    button.innerHTML = `
      ${logoMarkup(work)}
      <span>
        <span class="work-name">${work.title}</span>
        <span class="work-meta">${visibleCount || work.imageCount} images</span>
      </span>
    `;
    button.addEventListener("click", () => {
      state.activeWork = work;
      state.activeProduct = "all";
      render();
    });
    els.workIndex.appendChild(button);
  }
}

function renderActiveWork() {
  const work = state.activeWork;
  els.activeWork.innerHTML = `
    ${logoMarkup(work, true)}
    <div class="active-title">
      <h2>${work.title}</h2>
    </div>
  `;
}

function renderTabs() {
  const work = state.activeWork;
  const allCount = countVisibleImages(work);
  const visibleProducts = work.products
    .map((product) => ({
      ...product,
      visibleCount: filteredImagesFor(work, product).length,
    }))
    .filter((product) => product.visibleCount > 0);
  const activeProductVisible = state.activeProduct === "all"
    || visibleProducts.some((product) => product.code === state.activeProduct);
  if (!activeProductVisible) {
    state.activeProduct = "all";
  }

  const tabs = allCount > 0
    ? [{ code: "all", title: "全部", visibleCount: allCount }, ...visibleProducts]
    : [];
  els.productTabs.innerHTML = "";

  for (const product of tabs) {
    const button = document.createElement("button");
    button.className = `tab${state.activeProduct === product.code ? " active" : ""}`;
    button.textContent = `${product.title} ${product.visibleCount}`;
    button.addEventListener("click", () => {
      state.activeProduct = product.code;
      renderTabs();
      renderGallery();
    });
    els.productTabs.appendChild(button);
  }
}

function openViewer(image) {
  els.viewerImage.src = image.src;
  els.viewerImage.alt = image.name;
  els.viewerCaption.textContent = image.name;
  els.viewer.showModal();
}

function renderGallery() {
  const work = state.activeWork;
  const products = state.activeProduct === "all"
    ? work.products
    : work.products.filter((product) => product.code === state.activeProduct);
  els.gallery.innerHTML = "";

  let rendered = 0;
  for (const product of products) {
    const images = filteredImagesFor(work, product);
    if (!images.length) continue;

    const title = document.createElement("h3");
    title.className = "section-title";
    title.textContent = `${product.title} · ${images.length}`;
    els.gallery.appendChild(title);

    for (const image of images) {
      const card = document.createElement("article");
      card.className = "image-card";
      card.innerHTML = `
        <img loading="lazy" src="${image.src}" alt="${image.name}">
      `;
      card.addEventListener("click", () => openViewer(image));
      els.gallery.appendChild(card);
      rendered += 1;
    }
  }

  if (!rendered) {
    els.gallery.innerHTML = `<div class="empty">没有匹配的图片</div>`;
  }
}

function render() {
  if (state.query && countVisibleImages(state.activeWork) === 0) {
    state.activeWork = data.works.find((work) => countVisibleImages(work) > 0) || data.works[0];
    state.activeProduct = "all";
  }
  renderIndex();
  renderActiveWork();
  renderTabs();
  renderGallery();
}

els.search.addEventListener("input", (event) => {
  state.query = event.target.value;
  state.activeProduct = "all";
  render();
});

els.closeViewer.addEventListener("click", () => els.viewer.close());
els.viewer.addEventListener("click", (event) => {
  if (event.target === els.viewer) els.viewer.close();
});

render();

  </script>
